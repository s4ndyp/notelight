services:
  notelight:
    # Gebruik de GHCR-image (CI bouwt :latest vanaf main).
    # Bij deploy vanuit Git in Dockhand mag `build: .` blijven staan.
    image: ghcr.io/s4ndyp/notelight:latest
    build: .
    container_name: notelight
    ports:
      # host:container — app bereikbaar op poort 8084, intern luistert PocketBase op 8080
      - "8084:8080"
    volumes:
      # Database + bijlagen persistent houden
      - notelight_data:/pb/pb_data
    restart: unless-stopped

volumes:
  notelight_data:
