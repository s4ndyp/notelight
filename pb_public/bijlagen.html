<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijlagen Galerij</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1a202c',
                            900: '#111827',
                            950: '#0b0f19',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
            gap: 2rem 1.75rem;
        }

        .gallery-group {
            position: relative;
            padding-top: 0.65rem;
        }

        .gallery-group-title {
            position: absolute;
            top: 0;
            left: 1rem;
            z-index: 2;
            max-width: calc(100% - 2rem);
            padding: 0 0.45rem;
            background: #0b0f19;
            color: #f3f4f6;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gallery-group-box {
            border: 2px solid #374151;
            border-radius: 0.85rem;
            background: rgba(17, 24, 39, 0.55);
            padding: 1.35rem 1rem 1rem;
            min-height: 10rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-content: flex-start;
            transition: border-color 0.15s;
        }

        .gallery-group:hover .gallery-group-box {
            border-color: #4b5563;
        }

        .gallery-thumb {
            display: block;
            width: 7.5rem;
            height: 7.5rem;
            border-radius: 0.65rem;
            overflow: hidden;
            border: 1px solid #374151;
            background: #111827;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .gallery-thumb:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.18);
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-thumb-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.5rem;
            color: #60a5fa;
            text-align: center;
        }

        .gallery-thumb-name {
            font-size: 0.62rem;
            line-height: 1.2;
            color: #9ca3af;
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .gallery-meta {
            width: 100%;
            margin-top: 0.45rem;
            padding: 0 0.15rem;
            font-size: 0.7rem;
            color: #6b7280;
        }

        .gallery-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .gallery-filter {
            flex: 1;
            min-width: 14rem;
        }

        .gallery-filter-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: #9ca3af;
            margin-bottom: 0.35rem;
        }

        .gallery-filter-input {
            width: 100%;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 0.65rem;
            padding: 0.55rem 0.85rem;
            font-size: 0.875rem;
            color: #f3f4f6;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .gallery-filter-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .gallery-filter-input::placeholder { color: #6b7280; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen font-sans selection:bg-blue-500/30">

    <header class="sticky top-0 z-20 border-b border-gray-800 bg-gray-900/90 backdrop-blur-sm">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-blue-400 transition-colors shrink-0">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Terug naar app
                </a>
                <div class="h-4 w-px bg-gray-700 shrink-0"></div>
                <h1 class="text-lg font-semibold text-white truncate">Bijlagen galerij</h1>
            </div>
            <div class="flex items-center gap-4 shrink-0">
                <a id="pb-admin-link" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-blue-400 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    PocketBase Admin
                </a>
                <button id="btn-refresh" type="button" class="inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-blue-400 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Vernieuwen
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="gallery-filters">
            <div class="gallery-filter">
                <label class="gallery-filter-label" for="filter-titel">Zoek op titel</label>
                <input type="search" id="filter-titel" class="gallery-filter-input" placeholder="Filter op recordtitel..." autocomplete="off">
            </div>
            <div class="gallery-filter">
                <label class="gallery-filter-label" for="filter-filename">Zoek op bestandsnaam</label>
                <input type="search" id="filter-filename" class="gallery-filter-input" placeholder="Filter op bijlagebestand..." autocomplete="off">
            </div>
        </div>

        <p id="gallery-summary" class="text-sm text-gray-400 mb-6">Bijlagen laden...</p>

        <div id="loading" class="flex items-center justify-center py-24">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
        </div>

        <div id="gallery-empty" class="hidden flex flex-col items-center justify-center py-24 text-gray-500">
            <svg class="w-16 h-16 mb-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <p class="text-lg">Geen bijlagen gevonden</p>
            <p class="text-sm mt-1">Voeg bijlagen toe aan records in de hoofdapp.</p>
        </div>

        <div id="gallery-grid" class="gallery-grid hidden"></div>
    </main>

    <script>
        const PB_URL = window.location.origin;
        const COLLECTION_NAME = 'registraties';

        const pb = new PocketBase(PB_URL);
        const galleryGrid = document.getElementById('gallery-grid');
        const galleryEmpty = document.getElementById('gallery-empty');
        const gallerySummary = document.getElementById('gallery-summary');
        const loadingEl = document.getElementById('loading');
        const filterTitel = document.getElementById('filter-titel');
        const filterFilename = document.getElementById('filter-filename');

        let allRecords = [];
        let emptyMessage = {
            title: 'Geen bijlagen gevonden',
            subtitle: 'Voeg bijlagen toe aan records in de hoofdapp.'
        };

        document.getElementById('pb-admin-link').href = `${PB_URL}/_/`;

        function escapeAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function getBijlagen(record) {
            if (!record?.bijlage) return [];
            return Array.isArray(record.bijlage) ? record.bijlage.filter(Boolean) : [record.bijlage];
        }

        function isImageFileName(name) {
            return /\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(name || '');
        }

        function renderThumb(record, fileName) {
            const fileUrl = pb.files.getUrl(record, fileName);
            const safeName = escapeAttr(fileName);

            if (isImageFileName(fileName)) {
                const thumbUrl = pb.files.getUrl(record, fileName, { thumb: '300x300f' });
                return `
                    <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="gallery-thumb" title="${safeName}">
                        <img src="${thumbUrl}" alt="${safeName}" loading="lazy" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${fileUrl}'}">
                    </a>`;
            }

            return `
                <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="gallery-thumb" title="${safeName}">
                    <span class="gallery-thumb-fallback">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        <span class="gallery-thumb-name">${safeName}</span>
                    </span>
                </a>`;
        }

        function renderGroup(record, files) {
            if (!files.length) return '';

            const title = record.titel?.trim() || 'Zonder titel';
            const meta = [record.soort, record.status].filter(Boolean).join(' · ');

            return `
                <article class="gallery-group">
                    <h2 class="gallery-group-title" title="${escapeAttr(title)}">${escapeAttr(title)}</h2>
                    <div class="gallery-group-box">
                        ${files.map(fileName => renderThumb(record, fileName)).join('')}
                    </div>
                    ${meta ? `<p class="gallery-meta">${escapeAttr(meta)}</p>` : ''}
                </article>
            `;
        }

        function matchesFilter(value, query) {
            if (!query) return true;
            return String(value || '').toLowerCase().includes(query);
        }

        function getFilteredGroups() {
            const titelQuery = filterTitel.value.trim().toLowerCase();
            const filenameQuery = filterFilename.value.trim().toLowerCase();

            return allRecords
                .map(record => {
                    const title = record.titel?.trim() || 'Zonder titel';
                    if (!matchesFilter(title, titelQuery)) return null;

                    const files = getBijlagen(record).filter(fileName =>
                        matchesFilter(fileName, filenameQuery)
                    );
                    if (!files.length) return null;

                    return { record, files };
                })
                .filter(Boolean);
        }

        function renderGallery() {
            const groups = getFilteredGroups();
            const totalFiles = groups.reduce((sum, group) => sum + group.files.length, 0);
            const hasFilters = filterTitel.value.trim() || filterFilename.value.trim();

            galleryGrid.classList.add('hidden');
            galleryEmpty.classList.add('hidden');

            if (!allRecords.length) {
                gallerySummary.textContent = 'Geen bijlagen gevonden';
                galleryEmpty.querySelector('p.text-lg').textContent = emptyMessage.title;
                galleryEmpty.querySelector('p.text-sm').textContent = emptyMessage.subtitle;
                galleryEmpty.classList.remove('hidden');
                return;
            }

            if (!groups.length) {
                gallerySummary.textContent = hasFilters
                    ? 'Geen resultaten voor je zoekopdracht'
                    : 'Geen bijlagen gevonden';
                galleryEmpty.querySelector('p.text-lg').textContent = hasFilters
                    ? 'Geen bijlagen gevonden'
                    : emptyMessage.title;
                galleryEmpty.querySelector('p.text-sm').textContent = hasFilters
                    ? 'Pas je zoekfilters aan of wis ze om meer te zien.'
                    : emptyMessage.subtitle;
                galleryEmpty.classList.remove('hidden');
                return;
            }

            gallerySummary.textContent = hasFilters
                ? `${totalFiles} bijlage${totalFiles === 1 ? '' : 'n'} in ${groups.length} record${groups.length === 1 ? '' : 's'} (gefilterd)`
                : `${totalFiles} bijlage${totalFiles === 1 ? '' : 'n'} in ${groups.length} record${groups.length === 1 ? '' : 's'}`;

            galleryGrid.innerHTML = groups.map(({ record, files }) => renderGroup(record, files)).join('');
            galleryGrid.classList.remove('hidden');
        }

        async function loadGallery() {
            loadingEl.classList.remove('hidden');
            galleryGrid.classList.add('hidden');
            galleryEmpty.classList.add('hidden');
            gallerySummary.textContent = 'Bijlagen laden...';

            try {
                const result = await pb.collection(COLLECTION_NAME).getList(1, 500, {
                    sort: '-created',
                    requestKey: null
                });

                allRecords = result.items.filter(record => getBijlagen(record).length > 0);
                emptyMessage = {
                    title: 'Geen bijlagen gevonden',
                    subtitle: 'Voeg bijlagen toe aan records in de hoofdapp.'
                };

                loadingEl.classList.add('hidden');
                renderGallery();
            } catch (error) {
                loadingEl.classList.add('hidden');
                allRecords = [];
                gallerySummary.textContent = 'Fout bij laden';
                galleryEmpty.classList.remove('hidden');
                galleryEmpty.querySelector('p.text-lg').textContent = 'Kon bijlagen niet laden';
                galleryEmpty.querySelector('p.text-sm').textContent = error.message || 'Controleer of PocketBase draait.';
                console.error(error);
            }
        }

        let filterTimeout = null;
        function scheduleFilterRender() {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(renderGallery, 200);
        }

        filterTitel.addEventListener('input', scheduleFilterRender);
        filterFilename.addEventListener('input', scheduleFilterRender);

        document.getElementById('btn-refresh').addEventListener('click', loadGallery);
        loadGallery();
    </script>
</body>
</html>
